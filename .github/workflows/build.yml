name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AId-windows
            file: dist/AId.exe
          - os: macos-14          # Apple Silicon, Metal build
            artifact: AId-macos
            file: dist/AId.app
          - os: ubuntu-22.04      # older glibc = runs on more distros
            artifact: AId-linux
            file: dist/AId
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 espeak-ng python3-tk
      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # prebuilt CPU wheel on Win/Linux (avoid compiling); macOS wheel includes Metal
          pip install llama-cpp-python --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: python build.py
      - name: Zip mac app
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent AId.app AId-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'macOS' && 'dist/AId-macos.zip' || matrix.file }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.os == 'macOS' && 'dist/AId-macos.zip' || matrix.file }}
